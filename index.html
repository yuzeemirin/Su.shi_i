<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For You 💗</title>

<style>

/* =========================
   BASIC RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    font-family: Georgia, serif;

    background:
        linear-gradient(
            135deg,
            #ffe5f1,
            #fff7fb,
            #ffd9e9
        );

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   PAGES
========================= */

.page {
    position: absolute;

    width: 100%;
    height: 100vh;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 15px;
}

.page.active {
    display: flex;
}


/* =========================
   CARD
========================= */

.card {
    position: relative;

    width: min(92vw, 620px);
    min-height: 600px;

    padding: 30px 20px;

    background: rgba(255,255,255,0.91);

    border-radius: 42px;

    box-shadow:
        0 20px 60px rgba(220,80,140,0.20);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 5;
}


/* =========================
   GIF
========================= */

.gif {
    width: min(80vw, 320px);
    max-height: 280px;

    object-fit: contain;

    margin-bottom: 20px;

    border-radius: 25px;
}


/* =========================
   TEXT
========================= */

h1 {
    color: #e64f91;

    font-size: clamp(32px, 8vw, 50px);

    line-height: 1.15;

    margin-bottom: 18px;
}

h2 {
    color: #e64f91;

    font-size: clamp(27px, 6vw, 42px);

    line-height: 1.2;

    margin-bottom: 18px;
}

p {
    color: #725463;

    font-size: clamp(18px, 4vw, 24px);

    line-height: 1.5;

    margin-bottom: 22px;
}


/* =========================
   NORMAL BUTTON
========================= */

button {
    border: none;

    border-radius: 50px;

    padding: 14px 28px;

    font-family: Georgia, serif;

    font-size: 20px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   OKAY BUTTON
========================= */

.next {
    background: #f45c9d;

    color: white;

    min-width: 145px;

    box-shadow:
        0 7px 18px rgba(244,92,157,0.25);

    transition:
        transform 0.2s ease;
}

.next:active {
    transform: scale(0.95);
}


/* ==================================================
   YES / NO AREA
================================================== */

/*
   IMPORTANT:
   This is the safe area where NO will move.

   At the beginning:
   YES + NO are perfectly aligned.
*/

.button-area {

    position: relative;

    width: 100%;

    height: 210px;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 14px;

    margin-top: 5px;
}


/* =========================
   YES BUTTON
========================= */

.yes-button {

    position: relative;

    z-index: 10;

    min-width: 145px;

    padding: 14px 25px;

    background: #f45c9d;

    color: white;

    box-shadow:
        0 7px 18px rgba(244,92,157,0.25);

    transition:
        transform 0.2s ease;
}

.yes-button:active {
    transform: scale(0.95);
}


/* =========================
   NO BUTTON
========================= */

.no-button {

    position: relative;

    z-index: 20;

    min-width: 145px;

    padding: 14px 25px;

    background: #eeeeee;

    color: #555;

    /*
       Smooth movement
    */

    transition:
        left 0.75s cubic-bezier(.16,1,.3,1),
        top 0.75s cubic-bezier(.16,1,.3,1),
        transform 0.18s ease;
}


/*
   After first tap it becomes
   freely movable inside button-area.
*/

.no-button.moving {

    position: absolute;
}


/* =========================
   SUCCESS
========================= */

.success-card {

    animation:
        successPop 0.7s ease;
}

@keyframes successPop {

    0% {
        transform: scale(0.7);
        opacity: 0;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================
   FLOATING EMOJIS
========================= */

.float {

    position: fixed;

    z-index: 1;

    pointer-events: none;

    opacity: 0.75;

    animation:
        floating 7s ease-in-out infinite;
}

.flower1 {
    left: 4%;
    top: 10%;
    font-size: 35px;
}

.flower2 {
    right: 5%;
    top: 17%;
    font-size: 38px;
    animation-delay: 1s;
}

.flower3 {
    left: 5%;
    bottom: 16%;
    font-size: 40px;
    animation-delay: 2s;
}

.flower4 {
    right: 5%;
    bottom: 12%;
    font-size: 40px;
    animation-delay: 3s;
}

.flower5 {
    left: 22%;
    top: 5%;
    font-size: 27px;
    animation-delay: 1.5s;
}

.flower6 {
    right: 22%;
    top: 7%;
    font-size: 30px;
    animation-delay: 2.5s;
}

.flower7 {
    left: 3%;
    bottom: 5%;
    font-size: 43px;
    animation-delay: 3s;
}

.flower8 {
    right: 3%;
    bottom: 25%;
    font-size: 42px;
    animation-delay: 4s;
}


@keyframes floating {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-20px)
            rotate(8deg);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .card {
        width: 94vw;

        min-height: 590px;

        padding:
            25px 15px;

        border-radius: 36px;
    }

    .gif {
        width: 82vw;
        max-width: 290px;

        max-height: 250px;
    }

    .button-area {
        height: 190px;
    }

    .yes-button,
    .no-button {

        min-width: 130px;

        font-size: 18px;

        padding:
            13px 19px;
    }

    .button-area {
        gap: 9px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
                    FLOATING DECORATIONS
===================================================== -->

<div class="float flower1">🌸</div>
<div class="float flower2">💗</div>
<div class="float flower3">🌷</div>
<div class="float flower4">💖</div>
<div class="float flower5">✨</div>
<div class="float flower6">💕</div>
<div class="float flower7">🎁</div>
<div class="float flower8">🌹</div>



<!-- =====================================================
                        PAGE 1
===================================================== -->

<section
    id="page1"
    class="page active"
>

    <div class="card">

        <img
            class="gif"
            src="HyperRabbit%20_%20Very%20Good%20!!!%20(1).gif"
            alt="Cute GIF"
        >

        <h1>
            Hiii... 🥹💗
        </h1>

        <p>
            I have a tiny question for you...<br>
            Promise you won't laugh? 👀👉👈
        </p>

        <button
            class="next"
            onclick="openQuestion()"
        >
            Okayyy 💕
        </button>

    </div>

</section>



<!-- =====================================================
                        PAGE 2
===================================================== -->

<section
    id="page2"
    class="page"
>

    <div class="card">

        <img
            class="gif"
            src="Love%20Heartbeat%20Sticker%20-%20Love%20Heartbeat%20Heart%20-%20Discover%20%26%20Share%20GIFs.gif"
            alt="Heart GIF"
        >

        <h2>
            Okay... here goes nothing 🥹
        </h2>

        <p>
            Will you be my person? 💗
        </p>


        <!--
             YES + NO

             They start side-by-side.
             NO moves after every tap.
        -->

        <div
            class="button-area"
            id="buttonArea"
        >

            <button
                class="yes-button"
                onclick="sayYes()"
            >
                YESSS 💕
            </button>


            <button
                class="no-button"
                id="noButton"
                onclick="moveNoButton()"
            >
                NO 🙈
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
                       YES RESULT
===================================================== -->

<section
    id="success"
    class="page"
>

    <div class="card success-card">

        <img
            class="gif"
            src="Good%20Job%20Good%20GIF%20-%20Good%20Job%20Good%20Good%20Girl%20-%20Discover%20%26%20Share%20GIFs.gif"
            alt="Good Job GIF"
        >

        <h1>
            YAYYYYY 😭💗
        </h1>

        <p>
            You just made my day a little more special. ✨
        </p>

        <div
            style="
                font-size:34px;
                margin-top:5px;
            "
        >
            🌷 💗 ✨ 🥹 💕
        </div>

    </div>

</section>



<!-- =====================================================
                         SONG
===================================================== -->

<audio
    id="loveSong"
    preload="auto"
    playsinline
>
    <source
        src="love-song.mp3"
        type="audio/mpeg"
    >
</audio>



<script>


/* =====================================================
                    PAGE 1 → PAGE 2
===================================================== */

function openQuestion() {

    document
        .getElementById("page1")
        .classList.remove("active");

    document
        .getElementById("page2")
        .classList.add("active");

}



/* =====================================================
                     NO BUTTON
===================================================== */

/*
   The first time:

       YESSS 💕    NO 🙈

   After tapping NO:

       NO moves somewhere else.

   Every following tap:

       NO moves again.

   It always stays inside the
   visible movement area.
*/


let noHasMoved = false;


function moveNoButton() {

    const noButton =
        document.getElementById("noButton");

    const area =
        document.getElementById("buttonArea");


    /*
       Convert NO from normal flex
       position to absolute position.
    */

    if (!noHasMoved) {

        /*
           Get its current position
           BEFORE changing position.
        */

        const buttonRect =
            noButton.getBoundingClientRect();

        const areaRect =
            area.getBoundingClientRect();


        /*
           Calculate where it currently is
           inside the movement area.
        */

        const currentX =
            buttonRect.left -
            areaRect.left;

        const currentY =
            buttonRect.top -
            areaRect.top;


        /*
           Now make it movable.
        */

        noButton.classList.add("moving");


        /*
           Keep exactly where it was.
        */

        noButton.style.left =
            currentX + "px";

        noButton.style.top =
            currentY + "px";


        noHasMoved = true;


        /*
           Wait one frame before moving
           to make the first movement
           visibly smooth.
        */

        requestAnimationFrame(function() {

            moveToNewPosition();

        });

    }

    else {

        moveToNewPosition();

    }

}



/* =====================================================
              FIND A NEW SAFE POSITION
===================================================== */

function moveToNewPosition() {

    const noButton =
        document.getElementById("noButton");

    const area =
        document.getElementById("buttonArea");


    /*
       Size of movement area.
    */

    const areaWidth =
        area.clientWidth;

    const areaHeight =
        area.clientHeight;


    /*
       Size of NO button.
    */

    const buttonWidth =
        noButton.offsetWidth;

    const buttonHeight =
        noButton.offsetHeight;


    /*
       Safe padding.
    */

    const padding = 5;


    /*
       Maximum possible positions.
    */

    const maxX =
        areaWidth -
        buttonWidth -
        padding;

    const maxY =
        areaHeight -
        buttonHeight -
        padding;


    /*
       Generate a random position.
    */

    let newX =
        padding +
        Math.random() *
        Math.max(0, maxX - padding);


    let newY =
        padding +
        Math.random() *
        Math.max(0, maxY - padding);


    /*
       Make sure the button
       doesn't go outside.
    */

    newX =
        Math.max(
            padding,
            Math.min(
                newX,
                maxX
            )
        );


    newY =
        Math.max(
            padding,
            Math.min(
                newY,
                maxY
            )
        );


    /*
       Get current position.
    */

    const currentX =
        parseFloat(noButton.style.left) || 0;

    const currentY =
        parseFloat(noButton.style.top) || 0;


    /*
       Don't choose a position
       too close to the previous one.
    */

    let attempts = 0;

    while (
        Math.abs(newX - currentX) < 50 &&
        Math.abs(newY - currentY) < 45 &&
        attempts < 20
    ) {

        newX =
            padding +
            Math.random() *
            Math.max(0, maxX - padding);

        newY =
            padding +
            Math.random() *
            Math.max(0, maxY - padding);

        attempts++;

    }


    /*
       Smoothly move the button.
    */

    noButton.style.left =
        newX + "px";

    noButton.style.top =
        newY + "px";


    /*
       Small bounce effect.
    */

    noButton.style.transform =
        "scale(0.88)";

    setTimeout(function() {

        noButton.style.transform =
            "scale(1)";

    }, 180);

}



/* =====================================================
                         YES
===================================================== */

function sayYes() {

    /*
       Change to final screen.
    */

    document
        .getElementById("page2")
        .classList.remove("active");

    document
        .getElementById("success")
        .classList.add("active");


    /*
       Start song from 1:57.
    */

    playSongFrom117();

}



/* =====================================================
                  SONG START
===================================================== */

/*
   1 minute 57 seconds

   = 60 + 57

   = 117 seconds
*/


const song =
    document.getElementById("loveSong");


function playSongFrom117() {

    /*
       Load the MP3.
    */

    song.load();


    /*
       Wait until browser knows
       the audio duration.
    */

    song.addEventListener(
        "loadedmetadata",
        function() {

            /*
               Start exactly at 1:57.
            */

            song.currentTime = 117;


            /*
               Play.
            */

            song.play().catch(
                function(error) {

                    console.log(
                        "Could not play song:",
                        error
                    );

                }
            );

        },
        {
            once: true
        }
    );

}



/* =====================================================
                     SONG LOOP
===================================================== */

/*
   When the song finishes,
   start again from 1:57.
*/

song.addEventListener(
    "ended",
    function() {

        song.currentTime = 117;

        song.play().catch(
            function(error) {

                console.log(
                    "Could not restart song:",
                    error
                );

            }
        );

    }
);

</script>

</body>
  </html>
