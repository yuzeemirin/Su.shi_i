<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tiny Question 💗</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffd9e8, transparent 35%),
        radial-gradient(circle at 80% 70%, #ffc1d9, transparent 35%),
        linear-gradient(135deg, #ffb6d2, #ffe1ed, #ffb8d5);
    color: #8f315d;
}

/* LIQUID LIGHT */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        radial-gradient(ellipse, rgba(255,255,255,.38), transparent 45%);
    animation: liquid 12s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes liquid {
    from {
        transform: translate(-8%, -5%) rotate(0deg);
    }
    to {
        transform: translate(8%, 5%) rotate(12deg);
    }
}

/* GLASS CARD */
.page {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transform: scale(.96);
    transition: opacity .7s ease, transform .7s ease;
}

.page.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}

.card {
    width: min(430px, 94vw);
    min-height: 470px;
    padding: 30px 22px;
    text-align: center;

    background: rgba(255,255,255,.22);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 32px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 20px 60px rgba(160,50,100,.18),
        inset 0 1px 1px rgba(255,255,255,.8),
        inset 0 -1px 1px rgba(255,255,255,.25);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;
}

/* glass shine */
.card::before {
    content: "";
    position: absolute;
    width: 180%;
    height: 70px;
    top: 0;
    left: -40%;
    background: rgba(255,255,255,.25);
    transform: rotate(-8deg);
    filter: blur(15px);
}

.gif {
    width: 190px;
    max-width: 75%;
    max-height: 190px;
    object-fit: contain;
    border-radius: 22px;
    margin-bottom: 20px;

    filter: drop-shadow(0 10px 15px rgba(160,40,90,.15));
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
    color: #a82f66;
}

p {
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 24px;
}

/* BUTTONS */
button {
    border: none;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
    border-radius: 50px;
    padding: 14px 30px;

    color: white;
    background: linear-gradient(135deg, #ff4f91, #d92e70);

    box-shadow:
        0 8px 22px rgba(200,40,100,.25),
        inset 0 1px 2px rgba(255,255,255,.6);

    transition: transform .25s ease, box-shadow .25s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(200,40,100,.3);
}

.yes {
    background: linear-gradient(135deg, #ff4f91, #e72f72);
}

.no {
    background: rgba(255,255,255,.45);
    color: #a13b66;
    border: 1px solid rgba(255,255,255,.8);
}

/* BUTTON AREA */
.button-area {
    position: relative;
    width: 310px;
    height: 75px;
    max-width: 90vw;
}

.button-area button {
    position: absolute;
    top: 10px;
}

.yes {
    left: 15px;
}

.no {
    left: 170px;
}

/* SUCCESS */
.success-card {
    min-height: 500px;
}

.success-title {
    font-size: 36px;
    animation: pop .8s ease;
}

@keyframes pop {
    0% {
        transform: scale(.5);
        opacity: 0;
    }
    70% {
        transform: scale(1.15);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* FALLING FLOWERS */
.fall {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 20;
    animation: fall linear forwards;
    user-select: none;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            translateX(var(--sway))
            rotate(420deg);
        opacity: .8;
    }
}

/* FLOATING HEARTS */
.float {
    position: fixed;
    pointer-events: none;
    animation: floatUp 5s linear infinite;
    opacity: .7;
    z-index: 2;
}

@keyframes floatUp {
    0% {
        transform: translateY(110vh) scale(.7);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform: translateY(-15vh) scale(1.2);
        opacity: 0;
    }
}

/* MUSIC STATUS */
.music-status {
    margin-top: 15px;
    font-size: 14px;
    color: #a13b66;
    opacity: .85;
}

@media (max-width: 480px) {
    .card {
        min-height: 460px;
        padding: 25px 18px;
    }

    h1 {
        font-size: 27px;
    }

    p {
        font-size: 17px;
    }

    .gif {
        width: 165px;
    }

    .button-area {
        width: 290px;
    }

    .no {
        left: 155px;
    }
}
</style>
</head>

<body>

<!-- FLOATING DECORATIONS -->
<div class="float" style="left:8%;animation-delay:0s;">💗</div>
<div class="float" style="left:25%;animation-delay:2s;">🌸</div>
<div class="float" style="left:48%;animation-delay:1s;">💕</div>
<div class="float" style="left:70%;animation-delay:3s;">🌷</div>
<div class="float" style="left:88%;animation-delay:1.5s;">✨</div>


<!-- =========================
        PAGE 1
========================= -->

<section id="page1" class="page active">

    <div class="card">

        <img
            class="gif"
            src="./HyperRabbit _ Very Good !!! (1).gif"
            alt="cute gif"
        >

        <h1>Hiii... 🥹💗</h1>

        <p>
            I have a tiny question for you... 👀
            <br>
            Promise you won't laugh? 👉👈
        </p>

        <button onclick="goToPage2()">
            Okayyy 💕
        </button>

    </div>

</section>


<!-- =========================
        PAGE 2
========================= -->

<section id="page2" class="page">

    <div class="card">

        <img
            class="gif"
            src="./Love Heartbeat Sticker - Love Heartbeat Heart - Discover & Share GIFs.gif"
            alt="heart gif"
        >

        <h1>Okay... here goes nothing 🥹</h1>

        <p>
            Will you be my person? 💗
        </p>

        <div class="button-area">

            <button
                class="yes"
                onclick="sayYes()"
            >
                YESSS 💗
            </button>

            <button
                id="noButton"
                class="no"
                onclick="moveNo()"
            >
                NO 🙈
            </button>

        </div>

    </div>

</section>


<!-- =========================
        SUCCESS PAGE
========================= -->

<section id="success" class="page">

    <div class="card success-card">

        <img
            class="gif"
            src="./Good Job Good GIF - Good Job Good Good Girl - Discover & Share GIFs.gif"
            alt="celebration gif"
        >

        <h1 class="success-title">
            YAYYYYY 😭💗
        </h1>

        <p>
            You just made my day
            <br>
            a little more special. ✨
        </p>

        <div class="music-status">
            🎵 Playing from 1:57 💕
        </div>

    </div>

</section>


<!-- =========================
        AUDIO
========================= -->

<audio
    id="loveSong"
    src="./love-song.mp3"
    preload="auto"
    playsinline
></audio>


<script>

/* =========================
        PAGE CONTROL
========================= */

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const success = document.getElementById("success");

function goToPage2() {

    page1.classList.remove("active");

    setTimeout(() => {
        page2.classList.add("active");
    }, 100);

}


/* =========================
        NO BUTTON
========================= */

const noButton = document.getElementById("noButton");

function moveNo() {

    const area = document.querySelector(".button-area");

    const maxX = area.clientWidth - noButton.offsetWidth;
    const maxY = area.clientHeight - noButton.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noButton.style.left = randomX + "px";
    noButton.style.top = randomY + "px";

}


/* =========================
        SONG
========================= */

const song = document.getElementById("loveSong");

const START_TIME = 117; // 1:57
let metadataReady = false;


/*
   Load the song while the page is open.
   This makes it much more likely that the
   YES click can start playback immediately.
*/

song.addEventListener("loadedmetadata", function () {

    metadataReady = true;

    /*
       Prepare the song at 1:57 before
       the user presses YES.
    */

    if (song.duration > START_TIME) {
        try {
            song.currentTime = START_TIME;
        } catch (e) {}
    }

});

song.load();


/* =========================
        YES BUTTON
========================= */

function sayYes() {

    page2.classList.remove("active");

    setTimeout(() => {
        success.classList.add("active");
    }, 150);


    /*
       IMPORTANT:
       play() is called directly from the
       YES button click.
       This helps mobile browsers allow
       the audio.
    */

    if (metadataReady && song.duration > START_TIME) {

        try {
            song.currentTime = START_TIME;
        } catch (e) {}

        song.play().catch(function(error) {
            console.log("Audio playback blocked:", error);
        });

    } else {

        /*
           Start playback immediately because
           this is still inside the YES click.
        */

        const playPromise = song.play();

        /*
           When the audio metadata becomes ready,
           jump to 1:57.
        */

        song.addEventListener(
            "loadedmetadata",
            function seekToStart() {

                if (song.duration > START_TIME) {

                    try {
                        song.currentTime = START_TIME;
                    } catch (e) {}

                }

            },
            { once: true }
        );

        if (playPromise) {

            playPromise.catch(function(error) {

                console.log(
                    "Audio playback blocked:",
                    error
                );

            });

        }

    }

}


/* =========================
        LOOP FROM 1:57
========================= */

song.addEventListener("ended", function () {

    if (song.duration > START_TIME) {

        song.currentTime = START_TIME;

        song.play().catch(function(error) {
            console.log("Loop blocked:", error);
        });

    }

});


/* =========================
        STOP SONG ON EXIT
========================= */

/*
   This stops the music when the user
   leaves/closes/navigates away from the page.
*/

window.addEventListener("pagehide", function () {

    song.pause();

    try {
        song.currentTime = 0;
    } catch (e) {}

});

window.addEventListener("beforeunload", function () {

    song.pause();

    try {
        song.currentTime = 0;
    } catch (e) {}

});


/* =========================
        FALLING FLOWERS
========================= */

const flowers = [
    "🌸",
    "🌷",
    "🌹",
    "🌺",
    "💮",
    "🌼",
    "💗",
    "💕"
];

function createFlower() {

    const flower = document.createElement("div");

    flower.className = "fall";

    flower.textContent =
        flowers[
            Math.floor(Math.random() * flowers.length)
        ];

    flower.style.left =
        Math.random() * 100 + "vw";

    flower.style.fontSize =
        (14 + Math.random() * 18) + "px";

    flower.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    flower.style.setProperty(
        "--sway",
        (Math.random() * 160 - 80) + "px"
    );

    document.body.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, 11000);

}


/*
   Continuous falling flowers
*/

setInterval(createFlower, 350);


/* Create some immediately */

for (let i = 0; i < 12; i++) {

    setTimeout(
        createFlower,
        i * 250
    );

}

</script>

</body>
  </html>
